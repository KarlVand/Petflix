<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Style Movie Collection</title>
    <link rel="stylesheet" href="stylesheets/allmovies.css" />
  </head>
  <body>
    <header>
      <h1>Movie Collection</h1>
    </header>

    <main id="main-content">
      <div id="movies-container">
        <!-- Exemple de film -->
        <div class="movie">
          <img
            src="https://image.tmdb.org/t/p/w500/path_to_poster.jpg"
            alt="Movie Title"
          />
          <div class="movie-info">
            <h3>Titre du film</h3>
            <p>Date d'aparition</p>
          </div>
          <div class="overview">
            <h4>Overview</h4>
            <p>Description du film</p>
          </div>
        </div>
      </div>
    </main>

    <script src="db_to_front.js"></script>
  </body>
</html>
